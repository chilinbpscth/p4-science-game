<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 P4 科學科 - 太空冒險</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans TC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(180deg, #05051a 0%, #0d0d3d 40%, #1a0a3a 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

/* == STARS == */
.stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.star {
  position: absolute; border-radius: 50%; background: #fff;
  animation: twinkle var(--dur) ease-in-out infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.2; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1.2); }
}

/* == SHOOTING STAR == */
.shooting-star {
  position: fixed; width: 4px; height: 4px; background: #fff; border-radius: 50%;
  box-shadow: 0 0 6px 2px rgba(255,255,255,0.6);
  animation: shoot 4s linear infinite; pointer-events: none; z-index: 1;
  top: 10%; left: 80%;
}
@keyframes shoot {
  0% { transform: translate(0, 0); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(-200px, 200px); opacity: 0; }
}

/* == SCREENS == */
.screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 780px; padding: 16px; position: relative; z-index: 2; }
.screen.active { display: flex; }

/* == TITLE SCREEN == */
.title-screen { text-align: center; }
.title-screen .rocket-title { font-size: 80px; display: block; margin-bottom: 4px; animation: hover 2s ease-in-out infinite; }
@keyframes hover {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-16px); }
}
.title-screen h1 { font-size: 2.8em; color: #ffd700; text-shadow: 0 0 40px #ff8c00, 0 4px 8px rgba(0,0,0,0.5); margin-bottom: 6px; }
.title-screen .subtitle { color: #99ccff; font-size: 1em; margin-bottom: 8px; }
.title-screen .route-preview { color: #6666aa; font-size: 1.6em; letter-spacing: 6px; margin: 8px 0 16px; }
.title-screen .rules { color: #aaa; font-size: 0.9em; line-height: 1.8; margin-bottom: 20px; }
.title-screen .rules span.highlight { color: #ffd700; font-weight: 700; }

.btn {
  background: linear-gradient(180deg, #00ccff, #0066ff);
  border: 3px solid #0044aa; color: #fff;
  font-size: 1.3em; font-weight: 900; padding: 14px 40px;
  border-radius: 50px; cursor: pointer; transition: all 0.2s;
  font-family: inherit; box-shadow: 0 6px 0 #003388, 0 0 30px rgba(0,102,255,0.4);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #003388, 0 0 40px rgba(0,102,255,0.6); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #003388; }
.btn.restart { background: linear-gradient(180deg, #ff6b6b, #c0392b); border-color: #7b241c; box-shadow: 0 6px 0 #5a1a14; }

/* == LOGIN SCREEN == */
.login-box {
  background: rgba(255,255,255,0.06); border: 2px solid rgba(100,150,255,0.25);
  border-radius: 20px; padding: 22px 24px; margin: 6px 0 18px;
  display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px;
}
.login-box label { color: #99ccff; font-size: 0.9em; font-weight: 700; text-align: left; margin-bottom: -6px; }
.login-input {
  font-family: inherit; font-size: 1.1em; padding: 12px 16px;
  border-radius: 12px; border: 2px solid #3a4a7a; background: #0d1030;
  color: #fff; outline: none; transition: border-color 0.2s; width: 100%;
}
.login-input:focus { border-color: #00ccff; }
.login-input::placeholder { color: #5566aa; }
select.login-input { cursor: pointer; }
select.login-input option { background: #0d1030; }
.login-error { color: #ff6b6b; font-size: 0.85em; min-height: 1.2em; font-weight: 700; }
.player-tag {
  color: #88ccff; font-size: 0.85em; margin-bottom: 8px; font-weight: 700;
}

/* == GAME HEADER == */
.game-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: #fff; }
.fuel-display { font-size: 1.2em; }
.fuel-display .fuel-full { color: #ff4444; }
.fuel-display .fuel-empty { color: #333; }
.score-display { color: #ffd700; font-weight: 900; font-size: 1.1em; }
.combo-display { color: #00ffcc; font-weight: 900; font-size: 0.9em; min-height: 1.4em; }

/* == PLANET PATH == */
.planet-path {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 12px 8px; position: relative; margin-bottom: 4px;
  background: rgba(255,255,255,0.03); border-radius: 40px;
}
.planet-path::before {
  content: ''; position: absolute; top: 50%; left: 30px; right: 30px;
  height: 3px; background: linear-gradient(90deg, #224466, #4466aa, #6644aa);
  z-index: 0; border-radius: 2px;
}
.planet-node {
  display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1;
  transition: all 0.3s; width: 30px;
}
.planet-node .icon { font-size: 16px; transition: all 0.4s; filter: grayscale(0.8) brightness(0.5); }
/* 站數多，星球名統一靠下面狀態列顯示，避免迫到一齊 */
.planet-node .label { display: none; }
.planet-node.current .icon { font-size: 24px; filter: grayscale(0) brightness(1.2); animation: pulse-planet 1s ease-in-out infinite; }
.planet-node.visited .icon { filter: grayscale(0) brightness(1); }
@keyframes pulse-planet {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* == ROCKET == */
.rocket-area {
  width: 100%; text-align: center; min-height: 40px;
  font-size: 36px; margin-bottom: 2px;
  transition: all 0.5s ease;
}
.rocket-area.fly { animation: rocket-blast 0.6s ease-in-out; }
@keyframes rocket-blast {
  0% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-20px) scale(1.1); }
  60% { transform: translateY(5px) scale(0.95); }
  100% { transform: translateY(0) scale(1); }
}
.rocket-area.hit { animation: rocket-shake 0.5s ease-in-out; }
@keyframes rocket-shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-10px) rotate(-3deg); }
  40% { transform: translateX(10px) rotate(3deg); }
  60% { transform: translateX(-6px) rotate(-2deg); }
  80% { transform: translateX(6px) rotate(2deg); }
}

.status-msg {
  color: #88ccff; font-size: 0.85em; min-height: 1.4em; margin-bottom: 6px;
  text-align: center; font-weight: 700;
}
.status-msg.success { color: #00ff88; }
.status-msg.fail { color: #ff4444; }
.status-msg.info { color: #ffd700; }

/* == QUESTION CARD == */
.question-card {
  background: rgba(255,255,255,0.92); border-radius: 16px;
  padding: 18px 20px; width: 100%;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  border: 2px solid rgba(100,150,255,0.2);
}
.question-card .q-label { color: #4466ff; font-weight: 900; font-size: 0.9em; margin-bottom: 4px; }
.question-card .q-text { font-size: clamp(1.05rem, 2.8vw, 1.35rem); font-weight: 700; color: #1a1a2e; margin-bottom: 14px; line-height: 1.55; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.option-btn {
  background: #f0f4ff; border: 3px solid #ccd8f0;
  padding: 12px 14px; border-radius: 12px; font-size: clamp(0.95rem, 2.2vw, 1.1rem);
  cursor: pointer; transition: all 0.15s; text-align: left;
  font-family: inherit; color: #1a1a2e; font-weight: 600;
  min-height: 52px;
}
.option-btn:hover { background: #e0eaff; border-color: #8899cc; transform: translateY(-1px); }
.option-btn.correct { background: #00ff88 !important; border-color: #00aa55 !important; }
.option-btn.wrong { background: #ff4444 !important; border-color: #cc0000 !important; color: #fff !important; animation: shake 0.4s; }
.option-btn:disabled { pointer-events: none; }

.explanation {
  margin-top: 14px;
  padding: 11px 13px;
  background: #fff7e6;
  border-radius: 10px;
  font-size: 0.92em;
  color: #3a2a1a;
  border-left: 5px solid #ff9500;
  line-height: 1.5;
}
.explanation strong { color: #c65d00; font-weight: 800; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

/* == RESULT SCREEN == */
.result-screen { text-align: center; }
.result-screen .big-icon { font-size: 100px; display: block; margin-bottom: 8px; }
.result-screen h2 { color: #ffd700; font-size: 2em; margin: 6px 0; }
.result-screen .stats { color: #ccc; font-size: 1em; line-height: 2; margin: 8px 0 20px; }
.result-screen .stats span { color: #ffd700; font-weight: 900; }
.save-status { color: #00ffaa; font-size: 0.85em; min-height: 1.2em; margin-bottom: 10px; font-weight: 700; }
.save-status.saving { color: #ffd700; }
.save-status.error { color: #ff6b6b; }

/* == LEADERBOARD == */
.leaderboard {
  width: 100%; max-width: 380px; margin: 4px auto 16px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(120,160,255,0.25);
  border-radius: 14px; padding: 12px 14px;
}
.leaderboard .lb-title { color: #ffd700; font-weight: 900; font-size: 1em; margin-bottom: 4px; }
.leaderboard .lb-myrank { color: #00ffcc; font-size: 0.9em; font-weight: 700; margin-bottom: 8px; }
.leaderboard .lb-loading { color: #8899cc; font-size: 0.85em; padding: 6px 0; }
.lb-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; border-radius: 8px; font-size: 0.9em; color: #d8e0ff;
}
.lb-row + .lb-row { margin-top: 2px; }
.lb-row .lb-pos { width: 34px; text-align: center; font-weight: 900; }
.lb-row .lb-who { flex: 1; text-align: left; padding-left: 6px; }
.lb-row .lb-pts { color: #ffd700; font-weight: 900; }
.lb-row.me { background: rgba(0,255,200,0.15); border: 1px solid rgba(0,255,200,0.5); }
.lb-row.me .lb-who { color: #00ffcc; }
.lb-sep { color: #5566aa; text-align: center; font-size: 0.8em; margin: 4px 0; }

/* == RESPONSIVE == */
@media (max-width: 600px) {
  .planet-node .label { display: none; }
  .planet-node { width: 16px; }
  .planet-path { padding: 10px 4px; }
  .planet-node .icon { font-size: 12px; }
  .planet-node.current .icon { font-size: 18px; }
  .options { grid-template-columns: 1fr 1fr; gap: 6px; }
  .option-btn { font-size: clamp(0.9rem, 3.5vw, 1rem); padding: 11px 10px; min-height: 48px; }
  .question-card { padding: 14px 14px; }
  .question-card .q-text { font-size: clamp(1rem, 4vw, 1.2rem); }
  .title-screen h1 { font-size: 2em; }
  .title-screen .rocket-title { font-size: 60px; }
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="shooting-star"></div>

<!-- ====== LOGIN ====== -->
<div class="screen active" id="loginScreen">
  <div class="title-screen">
    <span class="rocket-title">🚀</span>
    <h1>太空冒險</h1>
    <p class="subtitle">四年級科學科・考試溫習</p>
    <div class="login-box">
      <label for="classInput">🏫 班別</label>
      <select class="login-input" id="classInput">
        <option value="">— 請選擇班別 —</option>
        <!-- 班別由下面 JS 的 CLASSES 自動產生 -->
      </select>
      <label for="numInput">🔢 學號</label>
      <select class="login-input" id="numInput">
        <option value="">— 請選擇學號 —</option>
        <!-- 學號由下面 JS 自動產生 1～40 -->
      </select>
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="btn" onclick="login()">登入 →</button>
  </div>
</div>

<!-- ====== TITLE ====== -->
<div class="screen" id="titleScreen">
  <div class="title-screen">
    <span class="rocket-title">🚀</span>
    <h1>太空冒險</h1>
    <p class="subtitle">四年級科學科・考試溫習</p>
    <div class="player-tag" id="playerTag"></div>
    <div class="route-preview">🌍 → 🌙 → ☀️ → 🪐 → 🌌 → … → 🏆</div>
    <p class="rules">
      <span class="highlight">✅ 答對</span> — 火箭前進到下一個星球<br>
      <span class="highlight">❌ 答錯</span> — 消耗 1 點燃料，停留原地<br>
      🔥 連續答對 3 題觸發加速獎勵！<br>
      ⛽ 燃料用盡 = 太空漂流……遊戲結束<br>
      🏆 跨越 <span class="highlight">20 個星球</span> = 冒險成功！
    </p>
    <button class="btn" onclick="startGame()">🚀 出發！</button>
  </div>
</div>

<!-- ====== GAME ====== -->
<div class="screen" id="gameScreen">
  <div class="game-header">
    <div class="fuel-display" id="fuelDisplay">⛽ ❤️❤️❤️❤️❤️</div>
    <div class="score-display" id="scoreDisplay">⚡ 0 分</div>
    <div class="combo-display" id="comboDisplay"></div>
  </div>

  <div class="planet-path" id="planetPath"></div>

  <div class="rocket-area" id="rocketArea">🚀</div>
  <div class="status-msg" id="statusMsg">🌍 準備好了嗎？向第一站出發！</div>

  <div class="question-card" id="questionCard">
    <div class="q-label" id="qLabel">選擇題</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optionsContainer"></div>
    <div id="explanation" class="explanation" style="display:none;"></div>
  </div>
</div>

<!-- ====== RESULT ====== -->
<div class="screen" id="resultScreen">
  <div class="result-screen">
    <span class="big-icon" id="resultIcon">🏆</span>
    <h2 id="resultTitle">恭喜通關！</h2>
    <div class="stats" id="resultStats"></div>
    <div class="save-status" id="saveStatus"></div>
    <div class="leaderboard" id="leaderboard" style="display:none;"></div>
    <button class="btn" onclick="startGame()">🔄 再玩一次，爭取第一！</button>
  </div>
</div>

<!-- ====== FIREBASE SDK (modular via npm + Vite) ====== -->
<script type="module">
  import { getDB, saveScore, getAllScores } from './js/firebase.js';
  window.fb = { getDB, saveScore, getAllScores };
</script>

<script>
// ==================== STUDENT INFO ====================
// 👇 改呢度就可以改班別選項
const CLASSES = ['4A', '4B', '4C', '4D', '4E'];
// 👇 改呢度就可以改學號範圍（預設 1～40）
const MAX_NUM = 40;

let studentName = '';      // 不再要打名，留空
let studentClass = '';
let studentNum = '';

// 填充班別、學號兩個下拉選單（全部用選擇，不使打字）
(function fillSelectors() {
  const classSel = document.getElementById('classInput');
  CLASSES.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    classSel.appendChild(o);
  });
  const numSel = document.getElementById('numInput');
  for (let i = 1; i <= MAX_NUM; i++) {
    const o = document.createElement('option');
    o.value = String(i); o.textContent = i + ' 號';
    numSel.appendChild(o);
  }
})();

function login() {
  const klass = document.getElementById('classInput').value;
  const num = document.getElementById('numInput').value;
  const err = document.getElementById('loginError');

  if (!klass) { err.textContent = '⚠️ 請選擇您的班別'; return; }
  if (!num) { err.textContent = '⚠️ 請選擇您的學號'; return; }

  studentClass = klass;
  studentNum = num;
  err.textContent = '';

  document.getElementById('playerTag').textContent =
    `🧑‍🚀 ${studentClass} 班 ${studentNum} 號`;

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('titleScreen').classList.add('active');
}

// 喺登入畫面撳 Enter 都可以登入
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('loginScreen').classList.contains('active')) {
    login();
  }
});

// ==================== PLANETS ====================
// 🎯 要答啱幾多題先過關 = 呢個陣列的站數 - 1（現在係 20 題）
//    想改題數，就喺度加／減站就得。
const planets = [
  { name: '地球', icon: '🌍' },
  { name: '雲層', icon: '☁️' },
  { name: '月球', icon: '🌙' },
  { name: '太空站', icon: '🛰️' },
  { name: '彗星', icon: '☄️' },
  { name: '水星', icon: '🟤' },
  { name: '金星', icon: '🟠' },
  { name: '太陽', icon: '☀️' },
  { name: '火星', icon: '🔴' },
  { name: '小行星帶', icon: '🌑' },
  { name: '木星', icon: '🪐' },
  { name: '土星', icon: '💫' },
  { name: '天王星', icon: '🔵' },
  { name: '海王星', icon: '🟣' },
  { name: '流星', icon: '🌠' },
  { name: '星雲', icon: '🌌' },
  { name: '銀河', icon: '✨' },
  { name: '黑洞', icon: '⚫' },
  { name: '外星基地', icon: '🛸' },
  { name: '神秘行星', icon: '👽' },
  { name: '終點', icon: '🏆' },
];

// ==================== QUESTION BANK ====================
const allQuestions = [
  // ── 🔬 物質特性 ──
  { label: '🔬 物質特性', q: '地盤判頭要選擇物料搭建棚架，需要堅固、承受得起重物的材料。以下哪一種最適合？', opts: ['玻璃磚', '發泡膠磚', '紙皮', '鋼管'], ans: 3, explain: '鋼管硬度高、強度大，可以承受重物與天氣變化，適合用作棚架結構。玻璃磚易碎、發泡膠與紙皮太輕，承受力不足。' },
  { label: '🔬 物質特性', q: '廚房入面個鐵鑊煎緊餃子，鑊身好熱但手柄不辣手。為什麼？', opts: ['手柄曉自動散熱', '手柄離火遠就不熱', '手柄會吸走熱力', '手柄用膠造，膠係不良導熱體'], ans: 3, explain: '膠為不良導熱體（熱的壞導體），熱力難以傳導至手柄，因此手柄不會過熱。鐵本身導熱迅速，所以鑊身很快變熱。' },
  { label: '🔬 物質特性', q: '小明將銅線同膠線分別放入電路，發現銅線可以令燈膽發光、膠線不得。呢個實驗證明了什麼？', opts: ['銅線會發熱', '銅線比膠線靚', '金屬係導電體、膠係絕緣體', '膠線太幼'], ans: 2, explain: '金屬（如銅）為導電體，可以傳輸電流；膠為絕緣體，阻擋電流，因此燈膽只會在銅線一端發光。' },
  { label: '🔬 物質特性', q: '花園的鐵欄杆生了啡紅色的鏽，鏽同原本的鐵相比有什麼不同？', opts: ['鏽同鐵完全一樣', '鏽係新物質，同鐵的性質不同', '鏽只係鐵表面污糟了', '鏽係鐵變返做原始狀態'], ans: 1, explain: '鏽是鐵與氧氣、水反應後產生的新物質（氧化鐵），其性質與鐵完全不同（例如顏色、硬度）。這屬於化學變化。' },
  { label: '🔬 物質特性', q: '滴了油的鐵鏈比起沒有滴油的鐵鏈更耐用，主要原因係？', opts: ['油令鐵鏈更軟', '油令鐵鏈更重', '油令鐵鏈更靚', '油形成保護層隔絕水同空氣，防鏽'], ans: 3, explain: '油可以形成保護層，阻隔水與氧氣接觸鐵鏈，減少氧化（生鏽），使鐵鏈更耐用。' },
  { label: '🔬 物質特性', q: '電工用膠轆嚟收納電線，不直接用金屬轆。為什麼？', opts: ['膠轆比較平', '膠轆顏色靚啲', '膠係絕緣體，萬一漏電都不會觸電', '膠轆比較輕'], ans: 2, explain: '膠為絕緣體，即使電線漏電，膠轆也不會導電，電工不會觸電。金屬轆會導電，相當危險。' },
  { label: '🔬 物質特性', q: '用鐵錘敲鐵釘，鐵釘會插入木板。如果用玻璃錘敲鐵釘會點？', opts: ['一樣插到入去', '鐵釘會變彎', '玻璃會碎爛', '沒有分別'], ans: 2, explain: '玻璃硬度高但脆，敲擊時會因受力而碎裂。鐵錘硬度高且具有韌性，適合敲打。' },

  // ── ⚗️ 變化類型 ──
  { label: '⚗️ 變化類型', q: '細路將紙巾撕成兩半，再點火燒了其中一半。呢兩種變化有什麼分別？', opts: ['撕開係化學變化，燒係物理變化', '兩個都係物理變化', '撕開係物理變化，燒係化學變化', '兩個都係化學變化'], ans: 2, explain: '撕開只是改變形狀，並無新物質產生（物理變化）；燃燒紙巾會產生新物質如二氧化碳和灰燼（化學變化）。' },
  { label: '⚗️ 變化類型', q: '以下邊個過程會產生全新的物質？', opts: ['將毛冷織成冷衫', '將糖溶入水中', '將衫晾乾', '將鐵釘放喺潮濕環境生鏽'], ans: 3, explain: '鐵釘生鏽是鐵與氧氣、水反應，產生新物質氧化鐵（鏽），屬於化學變化。其他只是狀態或形狀的改變。' },
  { label: '⚗️ 變化類型', q: '老豆用米釀酒，將米發酵之後變成酒。呢個過程屬於？', opts: ['物理變化，因為酒的顏色同米似', '物理變化，因為都係液體', '化學變化，因為產生了新物質（酒精）', '沒有變化，米仲係米'], ans: 2, explain: '發酵過程中，米的澱粉轉化為酒精和二氧化碳，產生全新物質，屬於化學變化。' },
  { label: '⚗️ 變化類型', q: '焗蛋糕嗰陣，麵團喺焗爐入面發大變金黃色。以下邊個情況同焗蛋糕最似？', opts: ['燒烤爐入面的炭燃燒', '冰塊喺枱面溶化', '橡筋圈俾人拉長', '紙巾濕水再曬乾'], ans: 0, explain: '焗蛋糕與炭燃燒均屬化學變化，會產生新物質（蛋糕內部結構改變、炭變為灰）。其他屬物理變化，只改變狀態或形狀。' },
  { label: '⚗️ 變化類型', q: '蘋果切開之後，切面慢慢變成啡色。呢個變化的原因係？', opts: ['蘋果接觸空氣產生了新物質（氧化）', '蘋果的水份蒸發了', '蘋果的顏色自然會變', '蘋果俾刀整傷了'], ans: 0, explain: '蘋果切開後，酶與氧氣反應產生新物質（氧化物），使切面變色，屬化學變化（氧化）。' },
  { label: '⚗️ 變化類型', q: '以下邊樣只能夠改變物件的形狀，不會產生新物質？', opts: ['將蛋糕焗燶', '將雞蛋煮熟', '將紙巾燃燒', '將鐵釘拗彎'], ans: 3, explain: '將鐵釘拗彎只是改變形狀，物質本身（鐵）並未改變，屬物理變化。煮熟蛋、燃燒紙巾、烤焦蛋糕均產生新物質，屬化學變化。' },
  { label: '⚗️ 變化類型', q: '實驗室用電解水嚟製造氫氣同氧氣。呢個係什麼變化？', opts: ['沒有變化', '化學變化，因為水分解成兩種新物質', '只係狀態改變', '物理變化，因為水變了做氣體'], ans: 1, explain: '電解水將水分子分解成氫氣和氧氣兩種全新物質，屬化學變化。雖然水變為氣體，但主要是產生新物質。' },

  // ── 💡 光的奧秘 ──
  { label: '💡 光的奧秘', q: '停電的晚上，入黑之後四周什麼都看不到。為什麼？', opts: ['黑色會吸走所有光', '所有物件都消失了', '沒有光源照射物件，光沒有進入眼睛', '眼睛在夜晚會壞'], ans: 2, explain: '我們看到物件是因為有光源發光，照射物件後反射入眼。如果沒有光源，光沒有反射入眼，就什麼都看不到。' },
  { label: '💡 光的奧秘', q: '阿家將電筒照向浴室的鏡子，光線會怎麼樣？', opts: ['被鏡面反射回來', '被鏡面吸收掉', '穿過鏡子', '在鏡面消失'], ans: 0, explain: '光線照到光滑鏡面會發生反射，反射角等於入射角，所以光線會反射回來，照出自己的樣子。' },
  { label: '💡 光的奧秘', q: '用一塊磨砂的鏡子照樣子，看到自己的樣子很模糊。磨砂鏡的表面其實是？', opts: ['完全不反射', '凹凸不平，光線向多方向反射', '更加平滑', '有顏色'], ans: 1, explain: '磨砂鏡表面凹凸不平，光線會向不同方向亂反射（漫反射），所以影像模糊。平滑鏡面才會規則反射，影像清晰。' },
  { label: '💡 光的奧秘', q: '中秋節玩燈籠，入面支蠟燭着了之後，成個燈籠就發光。邊個係光源？', opts: ['周圍的空氣', '蠟燭的火焰', '燈籰紙', '月亮'], ans: 1, explain: '光源係自己可以發光的物體。蠟燭火焰自己發光，係光源；燈籰紙只係反射光，不係光源。' },
  { label: '💡 光的奧秘', q: '天文台用氣象衞星監測颱風。衞星喺太空係點影到地球表面的相？', opts: ['衞星自己開着大光燈照落嚟', '衞星接收地球反射的太陽光', '靠月球幫手照明', '衞星入面有位攝影師'], ans: 1, explain: '衞星沒有自己發光，係靠太陽光照射地球，地球表面反射太陽光返去太空，衞星先影到地球的相。' },
  { label: '💡 光的奧秘', q: '望遠鏡的鏡片令遠方的山睇落好近。呢個現象係因為光產生了什麼？', opts: ['折射', '反射', '吸收', '消失'], ans: 0, explain: '望遠鏡鏡片係透鏡，光線通過透鏡時會折射（彎曲），令遠處物體的光線會聚，影像放大。' },
  { label: '💡 光的奧秘', q: '太陽光穿過三稜鏡之後會變成彩虹色。呢個現象顯示了什麼？', opts: ['陽光由多種顏色組成', '三稜鏡會發光', '光會停喺鏡入面', '三稜鏡入面有顏料'], ans: 0, explain: '太陽光（白光）由紅、橙、黃、綠、藍、靛、紫七種色光組成。通過三稜鏡時不同色光折射程度不同，分散成彩虹。' },

  // ── 🛞 摩擦力 ──
  { label: '🛞 摩擦力', q: '你將一張枱上的書由右邊推向中間。枱面對本書的摩擦力會向邊個方向？', opts: ['向上', '向右', '向左', '向前'], ans: 1, explain: '當你推書向右，書同枱面接觸，摩擦力會阻礙相對運動，所以摩擦力方向向左（反對推力方向）。' },
  { label: '🛞 摩擦力', q: '同學做實驗比較不同物料表面的摩擦力，佢可以拉動件物件度到什麼數值嚟比較？', opts: ['需要用幾大的力先拉到郁', '件物件的重量', '件物件的顏色', '件物件的温度'], ans: 0, explain: '摩擦力大小可以用拉動物件開始郁嗰陣的力去量度。力越大，摩擦力越大。' },
  { label: '🛞 摩擦力', q: '冬天行商場，地板好滑。地氈區域同瓷磚區域相比，邊度摩擦力大啲？', opts: ['地氈摩擦力大啲', '一樣', '沒有摩擦力', '瓷磚摩擦力大啲'], ans: 0, explain: '地氈表面粗糙，接觸面積大，摩擦力大；瓷磚光滑，摩擦力細。所以行地氈區域較穩陣。' },
  { label: '🛞 摩擦力', q: '搬屋公司用板車（手推車）搬運沉重的衣柜，係想利用乜嘢原理？', opts: ['保護地板', '加滾輪增加摩擦力，不會滑走', '令衣柜更靚', '加滾輪減少摩擦力，容易移動'], ans: 3, explain: '滾輪將滑動摩擦變為滾動摩擦，滾動摩擦力遠小過滑動摩擦力，所以更容易推動重物。' },
  { label: '🛞 摩擦力', q: '以下邊樣產品係為了增加摩擦力而設計？', opts: ['雪屐的光滑底部', '保齡球道的蠟', '門鉸的潤滑油', '波鞋鞋底的坑紋'], ans: 3, explain: '波鞋鞋底坑紋增加表面粗糙度，增加摩擦力，行路或跑步時不易滑倒。' },
  { label: '🛞 摩擦力', q: '小珊着住對鞋底磨蝕晒的舊布鞋去圖書館，喺光滑地板差啲跣親。為什麼？', opts: ['鞋底變得太硬', '鞋太輕', '地板太乾淨', '鞋底花紋沒有了，摩擦力變細'], ans: 3, explain: '鞋底花紋磨蝕後，表面變光滑，摩擦力減少，接觸光滑地板時容易打滑。' },
  { label: '🛞 摩擦力', q: '校工將潤滑油滴落門鉸之後，開門就沒有晒「吱吱」聲。潤滑油的作用係？', opts: ['增加摩擦力，令門更實', '令門更靚', '清潔門鉸', '減少摩擦力，令門轉動更順'], ans: 3, explain: '潤滑油喺門鉸之間形成油膜，減少兩個表面之間的摩擦力，令轉動順滑，沒有聲。' },
  { label: '🛞 摩擦力', q: '實驗比較網球喺三種表面（畫紙、砂紙、絨布）的摩擦力。要公平測試，以下邊項係必須保持不變？', opts: ['球的顏色', '斜板的傾斜角度同球開始位置', '室內的温度', '枱的高度'], ans: 1, explain: '要公平比較摩擦力，只可以改變表面物料，其他條件（如斜板角度、球開始位置）要一樣，否則結果不準。' },

  // ── 🚀 太空探索 ──
  { label: '🚀 太空探索', q: '中國航天員當中，邊位係第一位上太空的女航天員？', opts: ['翟志剛', '楊利偉', '劉洋', '聶海勝'], ans: 2, explain: '劉洋係2012年隨神舟九號飛船進入太空，成為中國第一位女航天員。' },
  { label: '🚀 太空探索', q: '太空人喺太空站剪頭髮，要用吸塵機一邊剪一邊吸走碎髮，因為？', opts: ['太空太凍', '頭髮會爆炸', '太空沒有重力，頭髮碎會四圍飄', '太空站要保持乾淨'], ans: 2, explain: '太空站沒有重力（微重力），頭髮碎會四圍飛，不會跌落，所以要用吸塵機吸走，避免影響儀器同呼吸。' },
  { label: '🚀 太空探索', q: '太空船返回地球時穿越大氣層，外殼產生高溫。為什麼會咁？', opts: ['太空船引擎的熱', '地球地心的熱力', '高速飛行同空氣摩擦生熱', '太陽直接照射'], ans: 2, explain: '太空船以極高速度返回，與大氣層劇烈摩擦，動能轉化為熱能，令外殼溫度急升。' },
  { label: '🚀 太空探索', q: '導航軟件（例如Google Maps）幫你搵最快路線去機場，主要用到哪一種衞星？', opts: ['通訊衞星', '導航衞星', '軍事衞星', '氣象衞星'], ans: 1, explain: '導航衞星（如GPS）發出精確時間同位置信號，接收器計算距離， triangulate 出位置，用嚟導航。' },
  { label: '🚀 太空探索', q: '太空同地球的環境好不同。以下邊項係太空環境的特點？', opts: ['有強烈輻射同微小高速碎片', '充滿氧氣，呼吸順暢', '有穩定的氣壓', '溫度恆常不變'], ans: 0, explain: '太空沒有大氣層保護，有強烈宇宙輻射，同埋高速微小碎片（太空垃圾），對太空人同設備構成危險。' },
  { label: '🚀 太空探索', q: '電視台直播奧運會，信號要由香港傳送到世界各地。主要依賴哪一種人造衞星？', opts: ['導航衞星', '氣象衞星', '偵察衞星', '通訊衞星'], ans: 3, explain: '通訊衞星接收地面信號，放大後轉發返地球其他地方，令直播訊號可以即時傳送到全球。' },
  { label: '🚀 太空探索', q: '太空人出艙活動前一定要着好太空衣，最關鍵的原因係？', opts: ['太空衣好靚', '太空衣可以裝好多嘢', '太空衣可以提供氧氣、隔絕輻射同維持溫度', '太空衣有無線電可以傾偈'], ans: 2, explain: '太空環境極端：沒有氧氣、輻射強、溫度極端（熱冷急變）。太空衣提供氧氣、調節溫度、阻擋輻射，維持生命。' },

  // ── 🧪 生活科學 ──
  { label: '🧪 生活科學', q: '嫲嫲用生果廚餘加黃糖自製環保清潔劑。佢發覺發酵嗰陣個樽會脹卜卜，為什麼？', opts: ['黃糖溶了之後體積變大', '發酵產生了氣體，積聚喺樽入面', '因為天氣太熱個樽膨脹', '生果發大了'], ans: 1, explain: '生果同糖發酵時，微生物分解有機物，產生二氧化碳氣體，氣體積聚喺密封樽內，壓力增加令樽脹起。' },
  { label: '🧪 生活科學', q: '小食店用電熱板烤雞蛋仔，塊金屬板好快熱到出煙，但隔離的膠手柄一啲都不辣手。呢個現象解釋了什麼？', opts: ['膠不會傳熱', '金屬同膠導熱速度一樣', '金屬導熱比膠快好多', '金屬手柄的温度其實沒有咁高'], ans: 2, explain: '金屬導熱速度遠快過膠（不良導熱體），熱力好快從金屬板傳到板面，但傳不到膠手柄，所以手柄不熱。' },
  { label: '🧪 生活科學', q: '浴室的地磚鋪了防滑地氈，呢個設計係應用了邊個科學原理？', opts: ['令浴室更靚', '減少摩擦力，行路更輕鬆', '加快水流走', '增加摩擦力，減少跣倒風險'], ans: 3, explain: '地氈表面粗糙，增加同腳底之間的摩擦力，防止濕滑地板上滑倒。' },
  { label: '🧪 生活科學', q: '實驗室用鐵架台固定儀器，鐵架台的底座又大又重。呢個設計目的係？', opts: ['導熱更快', '增加穩定性，避免成個架冧低', '令實驗更靚', '方便搬運'], ans: 1, explain: '底座大而重可以降低重心，增加接觸面積同重量，增大摩擦力同穩定性，避免儀器架傾倒。' },
  { label: '🧪 生活科學', q: '包裝食物的錫紙（鋁箔紙）的邊緣好利，好容易界親手。以下哪一種解釋最合理？', opts: ['鋁箔係金屬，可以做到好薄好鋒利', '鋁箔係膠造的', '鋁箔本身有毒', '鋁箔的邊緣有玻璃纖維'], ans: 0, explain: '金屬有延展性，可以壓成極薄的箔，邊緣切割後會好尖利，所以容易割傷手。' },
  { label: '🧪 生活科學', q: '阿強發覺鐵製的單車鏈生鏽之後踩得好吃力。以下邊個做法最啱？', opts: ['滴潤滑油減少摩擦', '換膠鏈', '倒水上去沖走啲鏽', '用火燒走啲鏽'], ans: 0, explain: '生鏽後表面粗糙，摩擦力大。滴潤滑油可以減少金屬間直接接觸，降低摩擦，令鏈條轉動順滑。' },

let currentPlanet, fuel, score, combo, totalCorrect, totalWrong, maxCombo;
let usedQuestions, isAnswering, currentQuestion, scoreSaved;
const MAX_FUEL = 8;   // ⛽ 答錯幾多次先 Game Over（越大越容易玩到尾）

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ==================== RENDER PLANET PATH ====================
function renderPlanetPath() {
  const container = document.getElementById('planetPath');
  container.innerHTML = '';
  planets.forEach((p, i) => {
    const node = document.createElement('div');
    node.className = 'planet-node';
    if (i === currentPlanet) node.classList.add('current');
    else if (i < currentPlanet) node.classList.add('visited');
    node.innerHTML = `<div class="icon">${p.icon}</div><div class="label">${p.name}</div>`;
    container.appendChild(node);
  });
}

// ==================== START ====================
function startGame() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('gameScreen').classList.add('active');

  currentPlanet = 0;
  fuel = MAX_FUEL;
  score = 0; combo = 0; maxCombo = 0; totalCorrect = 0; totalWrong = 0;
  usedQuestions = [];
  isAnswering = false;
  scoreSaved = false;

  renderPlanetPath();
  updateUI();
  document.getElementById('statusMsg').textContent = '🌍 從地球出發！準備好了嗎？';
  document.getElementById('rocketArea').textContent = '🚀';
  document.getElementById('comboDisplay').textContent = '';
  nextQuestion();
}

// ==================== NEXT QUESTION ====================
function nextQuestion() {
  if (isAnswering) return;
  if (usedQuestions.length >= allQuestions.length) usedQuestions = [];
  const available = allQuestions.filter((_, i) => !usedQuestions.includes(i));
  if (available.length === 0) { usedQuestions = []; return nextQuestion(); }

  const idx = allQuestions.indexOf(available[Math.floor(Math.random() * available.length)]);
  usedQuestions.push(idx);
  currentQuestion = allQuestions[idx];

  document.getElementById('qLabel').textContent = currentQuestion.label;
  document.getElementById('qText').textContent = currentQuestion.q;

  const exp = document.getElementById('explanation');
  if (exp) exp.style.display = 'none';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  currentQuestion.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = String.fromCharCode(65 + i) + '. ' + opt;
    btn.addEventListener('click', () => answer(i));
    container.appendChild(btn);
  });
}

// ==================== ANSWER ====================
function answer(idx) {
  if (isAnswering) return;
  isAnswering = true;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === currentQuestion.ans) b.classList.add('correct');
  });

  const rocket = document.getElementById('rocketArea');
  const status = document.getElementById('statusMsg');
  status.className = 'status-msg';

  if (idx === currentQuestion.ans) {
    // ✅ CORRECT
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    totalCorrect++;
    score += 10 + (combo >= 3 ? combo * 2 : 0);
    currentPlanet = Math.min(currentPlanet + 1, planets.length - 1);

    // Animations
    rocket.className = 'rocket-area fly';
    setTimeout(() => { rocket.className = 'rocket-area'; }, 600);

    const dest = planets[currentPlanet];
    if (currentPlanet >= planets.length - 1) {
      status.textContent = `🎉 到達 ${dest.name}！冒險完成！`;
      status.className = 'status-msg success';
    } else {
      const bonus = combo >= 3 ? ` 🔥 ${combo} 連擊 bonus!` : '';
      status.textContent = `✅ 答對了！火箭飛向 ${dest.icon} ${destName(dest)}！${bonus}`;
      status.className = 'status-msg success';
    }

    if (combo >= 3) document.getElementById('comboDisplay').textContent = `🔥 ${combo} 連擊！`;
  } else {
    // ❌ WRONG
    btns[idx].classList.add('wrong');
    combo = 0;
    totalWrong++;
    fuel--;
    score = Math.max(0, score - 5);

    rocket.className = 'rocket-area hit';
    setTimeout(() => { rocket.className = 'rocket-area'; }, 500);

    status.textContent = fuel > 0
      ? `❌ 燃料洩漏！⛽ 剩餘 ${fuel} 點燃料`
      : `❌ 燃料耗盡！`;
    status.className = 'status-msg fail';
    document.getElementById('comboDisplay').textContent = '';
  }

  // 顯示解釋（無論正確定錯誤，都講返正確答案同解釋）
  const expEl = document.getElementById('explanation');
  if (expEl && currentQuestion.explain) {
    const correctLetter = String.fromCharCode(65 + currentQuestion.ans);
    const correctText = currentQuestion.opts[currentQuestion.ans];
    expEl.innerHTML = `<strong>✅ 正確答案：${correctLetter}. ${correctText}</strong><br>${currentQuestion.explain}`;
    expEl.style.display = 'block';
  }

  renderPlanetPath();
  updateUI();

  // 增加時間畀學生睇解釋（尤其答錯時）
  setTimeout(() => {
    if (currentPlanet >= planets.length - 1) {
      victory();
    } else if (fuel <= 0) {
      gameOver();
    } else {
      isAnswering = false;
      nextQuestion();
    }
  }, 2200);
}

function destName(p) { return p.name; }

// ==================== UPDATE UI ====================
function updateUI() {
  // Fuel hearts
  let fuelStr = '⛽ ';
  for (let i = 0; i < MAX_FUEL; i++) {
    fuelStr += i < fuel ? '❤️' : '🖤';
  }
  document.getElementById('fuelDisplay').textContent = fuelStr;
  document.getElementById('scoreDisplay').textContent = `⚡ ${score} 分`;
}

// ==================== VICTORY ====================
function victory() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('resultScreen').classList.add('active');
  document.getElementById('resultIcon').textContent = '🏆';
  document.getElementById('resultTitle').textContent = '🎉 太空冒險成功！';
  const grade = totalWrong === 0 ? 'S 完美星際指揮官' : totalWrong <= 2 ? 'A 太空探險家' : totalWrong <= 4 ? 'B 星際旅人' : 'C 太空見習生';
  document.getElementById('resultStats').innerHTML = `
    評級：<span>${grade}</span><br>
    答對：<span>${totalCorrect} 題</span>　答錯：<span>${totalWrong} 題</span><br>
    總分：<span>${score} 分</span><br>
    剩餘燃料：<span>${'❤️'.repeat(fuel)}${'🖤'.repeat(MAX_FUEL - fuel)}</span><br>
    最高連擊：<span style="color:#00ffcc">${maxCombo} 連擊</span><br><br>
    🌟 表現出色的小太空人！
  `;
  saveScore('win', grade);
}

// ==================== GAME OVER ====================
function gameOver() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('resultScreen').classList.add('active');
  document.getElementById('resultIcon').textContent = '🛸';
  document.getElementById('resultTitle').textContent = '💥 燃料耗盡……';
  document.getElementById('resultStats').innerHTML = `
    到達星球：<span>${planets[currentPlanet].icon} ${planets[currentPlanet].name}</span><br>
    答對：<span>${totalCorrect} 題</span>　答錯：<span>${totalWrong} 題</span><br>
    總分：<span>${score} 分</span><br>
    最高連擊：<span style="color:#00ffcc">${maxCombo} 連擊</span><br><br>
    🔄 補充燃料，再次挑戰！
  `;
  saveScore('lose', '');
}

// ==================== SAVE SCORE TO FIREBASE ====================
async function saveScore(result, grade) {
  const el = document.getElementById('saveStatus');
  if (scoreSaved) return;        // 同一局只記錄一次
  scoreSaved = true;

  const fb = window.fb;
  if (!fb || !fb.getDB()) {
    el.className = 'save-status';
    el.textContent = '';         // Firebase 未設定，不顯示任何內容，遊戲照常
    return;
  }

  el.className = 'save-status saving';
  el.textContent = '💾 正在記錄成績…';

  try {
    await fb.saveScore({
      name: studentName,
      class: studentClass,
      num: studentNum || '',
      score: score,
      correct: totalCorrect,
      wrong: totalWrong,
      maxCombo: maxCombo,
      result: result,
      reached: planets[currentPlanet].name,
      grade: grade || '',
      fuelLeft: fuel
    });
    el.className = 'save-status';
    el.textContent = '✅ 成績已記錄！';
    loadLeaderboard();
  } catch (err) {
    console.error('記錄成績失敗：', err);
    el.className = 'save-status error';
    el.textContent = '⚠️ 成績記錄失敗（可截圖給老師）';
  }
}

// ==================== LEADERBOARD（排行榜）====================
// 使用「每位學生的最高分」排名，不會讓一個人狂玩洗版
async function loadLeaderboard() {
  const box = document.getElementById('leaderboard');
  const fb = window.fb;
  if (!fb || !fb.getDB()) { box.style.display = 'none'; return; }

  box.style.display = 'block';
  box.innerHTML = '<div class="lb-loading">🏆 載入排行榜…</div>';

  try {
    const scores = await fb.getAllScores();

    // 計每位學生（班別+學號）的最高分
    const best = {};
    scores.forEach(d => {
      const key = (d.class || '') + '|' + (d.num || '');
      const t = (d.createdAt && d.createdAt.toDate) ? d.createdAt.toDate().getTime() : 0;
      if (!best[key] || (d.score || 0) > best[key].score) {
        best[key] = { key, class: d.class, num: d.num, score: d.score || 0, t };
      }
    });

    // 分數高→低；同分就睇邊個先攞到（時間早優先）
    const list = Object.values(best).sort((a, b) => b.score - a.score || a.t - b.t);
    const myKey = studentClass + '|' + studentNum;
    const myRank = list.findIndex(e => e.key === myKey) + 1;
    const medals = ['🥇', '🥈', '🥉'];

    let html = '<div class="lb-title">🏆 班際排行榜</div>';
    if (myRank === 1) {
      html += '<div class="lb-myrank">👑 您現在是第 1 名！請保持！</div>';
    } else if (myRank > 0) {
      html += `<div class="lb-myrank">您現在排第 ${myRank} 名，再接再厲！</div>`;
    }

    const rowHTML = (e, rank) => {
      const me = e.key === myKey ? ' me' : '';
      const pos = rank <= 3 ? medals[rank - 1] : rank;
      return `<div class="lb-row${me}">
        <span class="lb-pos">${pos}</span>
        <span class="lb-who">${e.class} 班 ${e.num} 號${me ? '（您）' : ''}</span>
        <span class="lb-pts">${e.score} 分</span>
      </div>`;
    };

    // 顯示頭 10 名
    const top = list.slice(0, 10);
    top.forEach((e, i) => { html += rowHTML(e, i + 1); });

    // 如果自己跌出頭 10，喺下面補返自己嗰行
    if (myRank > 10) {
      html += '<div class="lb-sep">⋯⋯</div>';
      html += rowHTML(list[myRank - 1], myRank);
    }

    box.innerHTML = html;
  } catch (err) {
    console.error('排行榜載入失敗：', err);
    box.style.display = 'none';
  }
}

// ==================== STARS ====================
function createStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random() * 3;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random() * 100}%; top:${Math.random() * 100}%;
      --dur: ${1.5 + Math.random() * 3}s;
      animation-delay: -${Math.random() * 3}s;
    `;
    container.appendChild(s);
  }
}
createStars();
</script>
